[project]
name = "cortexcode-ai-provider-anthropic"
version = "0.0.3"
description = "Cortex AI leaf: provider-anthropic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-ai-stream>=0.0.3,<0.1.0",
    "cortexcode-ai-types>=0.0.3,<0.1.0",
    "cortexcode-ai-models>=0.0.3,<0.1.0",
    "cortexcode-ai-util>=0.0.3,<0.1.0",
    "cortexcode-ai-env>=0.0.3,<0.1.0",
    "cortexcode-ai-provider-common>=0.0.3,<0.1.0",
    "httpx>=0.27",
]

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[tool.uv.sources.cortexcode-ai-stream]
workspace = true

[tool.uv.sources.cortexcode-ai-types]
workspace = true

[tool.uv.sources.cortexcode-ai-models]
workspace = true

[tool.uv.sources.cortexcode-ai-util]
    workspace = true

[tool.uv.sources.cortexcode-ai-env]
    workspace = true

[tool.uv.sources.cortexcode-ai-provider-common]
    workspace = true

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
