[project]
name = "cortexcode-agent"
version = "0.0.3"
description = "Umbrella meta-package for the cortex agent namespace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
# Metadata-only distribution — there is no `cortex/` tree to select here, and
# selecting an empty one shipped a stray `.gitkeep` into site-packages.
bypass-selection = true

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
