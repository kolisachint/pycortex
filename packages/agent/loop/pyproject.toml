[project]
name = "cortexcode-agent-loop"
version = "0.0.3"
description = "Cortex agent leaf: loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-agent-types>=0.0.3,<0.1.0",
    "cortexcode-ai-stream>=0.0.3,<0.1.0",
    "cortexcode-ai-types>=0.0.3,<0.1.0",
]

[tool.cortex]
publish = true

[tool.uv.sources]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-types = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
