[project]
name = "cortexcode-cli-session"
version = "0.0.3"
description = "Cortex CLI leaf: session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-agent-agent>=0.0.3,<0.1.0",
    "cortexcode-agent-compaction>=0.0.3,<0.1.0",
    "cortexcode-agent-harness>=0.0.3,<0.1.0",
    "cortexcode-ai-models>=0.0.3,<0.1.0",
    "cortexcode-ai-stream>=0.0.3,<0.1.0",
    "cortexcode-ai-types>=0.0.3,<0.1.0",
    "cortexcode-cli-config>=0.0.3,<0.1.0",
    "cortexcode-cli-tools>=0.0.3,<0.1.0",
]

[tool.cortex]
publish = true

[tool.uv.sources]
cortexcode-agent-agent = { workspace = true }
cortexcode-agent-compaction = { workspace = true }
cortexcode-agent-harness = { workspace = true }
cortexcode-ai-models = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-cli-config = { workspace = true }
cortexcode-cli-tools = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
