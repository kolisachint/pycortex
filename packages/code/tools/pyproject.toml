[project]
name = "cortexcode-cli-tools"
version = "0.0.3"
description = "Cortex CLI leaf: tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-agent-types",
    "cortexcode-ai-types",
]

[tool.uv.sources]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
