[project]
name = "cortexcode-cli-main"
version = "0.0.3"
description = "Cortex CLI leaf: main"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-cli-config>=0.0.3,<0.1.0",
    "cortexcode-cli-interactive>=0.0.1,<0.1.0",
]

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[tool.uv.sources]
cortexcode-cli-config = { workspace = true }
cortexcode-cli-interactive = { workspace = true }

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
