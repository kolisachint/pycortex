[project]
name = "cortexcode-cli-interactive"
version = "0.0.1"
description = "Cortex CLI leaf: interactive TUI mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-ai-models>=0.0.3,<0.1.0",
    "cortexcode-ai-oauth>=0.0.3,<0.1.0",
    "cortexcode-ai-types>=0.0.3,<0.1.0",
    "cortexcode-cli-config>=0.0.3,<0.1.0",
    "cortexcode-cli-prompts>=0.0.3,<0.1.0",
    "cortexcode-cli-session>=0.0.3,<0.1.0",
    "cortexcode-cli-tools>=0.0.3,<0.1.0",
    "cortexcode-tui-components>=0.0.3,<0.1.0",
    "cortexcode-tui-fuzzy>=0.0.3,<0.1.0",
    "cortexcode-tui-images>=0.0.3,<0.1.0",
    "cortexcode-tui-keys>=0.0.3,<0.1.0",
    "cortexcode-tui-render>=0.0.3,<0.1.0",
    "cortexcode-tui-terminal>=0.0.3,<0.1.0",
    "cortexcode-tui-util>=0.0.3,<0.1.0",
]

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[tool.uv.sources]
cortexcode-ai-models = { workspace = true }
cortexcode-ai-oauth = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-cli-config = { workspace = true }
cortexcode-cli-prompts = { workspace = true }
cortexcode-cli-session = { workspace = true }
cortexcode-cli-tools = { workspace = true }
cortexcode-tui-components = { workspace = true }
cortexcode-tui-fuzzy = { workspace = true }
cortexcode-tui-images = { workspace = true }
cortexcode-tui-keys = { workspace = true }
cortexcode-tui-render = { workspace = true }
cortexcode-tui-terminal = { workspace = true }
cortexcode-tui-util = { workspace = true }

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
