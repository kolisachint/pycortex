[project]
name = "cortexcode-cli-config"
version = "0.0.3"
description = "Cortex CLI leaf: config"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-ai-env>=0.0.3,<0.1.0",
    "cortexcode-ai-models>=0.0.3,<0.1.0",
    "cortexcode-ai-oauth>=0.0.3,<0.1.0",
    "cortexcode-ai-types>=0.0.3,<0.1.0",
]

[tool.uv.sources]
cortexcode-ai-env = { workspace = true }
cortexcode-ai-models = { workspace = true }
cortexcode-ai-oauth = { workspace = true }
cortexcode-ai-types = { workspace = true }

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
