[project]
name = "cortexcode-cli-print"
version = "0.0.3"
description = "Cortex CLI leaf: print"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-cli-session>=0.0.3,<0.1.0",
]

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[tool.uv.sources]
cortexcode-cli-session = { workspace = true }

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
