[project]
name = "cortexcode-tui-render"
version = "0.0.3"
description = "Cortex TUI leaf: render"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-tui-util>=0.0.3,<0.1.0",
    "cortexcode-tui-keys>=0.0.3,<0.1.0",
    "cortexcode-tui-images>=0.0.3,<0.1.0",
]

[dependency-groups]
# Test-only: the parity harness (see packages/tui/testkit).
dev = [
    "cortexcode-tui-testkit",
]

[tool.uv.sources]
cortexcode-tui-util = { workspace = true }
cortexcode-tui-keys = { workspace = true }
cortexcode-tui-images = { workspace = true }
cortexcode-tui-testkit = { workspace = true }

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
