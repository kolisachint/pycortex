[project]
name = "cortexcode-tui-testkit"
version = "0.0.3"
description = "Cortex TUI leaf: testkit — authoritative rendering surface (never published)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-tui-util",
    "cortexcode-tui-images",
]

[tool.cortex]
# Test infrastructure, not a port of anything in hoocode. Never publish.
# `never_publish` is the permanent form of `publish = false`: it exempts this
# leaf from the "every leaf in the group publishes" audit that umbrella steps
# (1.8, 2.10, …) impose, which `publish = false` alone cannot express.
publish = false
never_publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[tool.uv.sources]
cortexcode-tui-util = { workspace = true }
cortexcode-tui-images = { workspace = true }

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
