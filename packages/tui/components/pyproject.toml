[project]
name = "cortexcode-tui-components"
version = "0.0.3"
description = "Cortex TUI leaf: components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortexcode-tui-render>=0.0.3,<0.1.0",
    "cortexcode-tui-util>=0.0.3,<0.1.0",
    "cortexcode-tui-editing>=0.0.3,<0.1.0",
    "cortexcode-tui-keys>=0.0.3,<0.1.0",
    "cortexcode-tui-fuzzy>=0.0.3,<0.1.0",
    "cortexcode-tui-images>=0.0.3,<0.1.0",
    "mistune>=3.0",
]

[tool.cortex]
publish = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/cortex",
]

[tool.uv.sources]
cortexcode-tui-render = { workspace = true }
cortexcode-tui-util = { workspace = true }
cortexcode-tui-editing = { workspace = true }
cortexcode-tui-keys = { workspace = true }
cortexcode-tui-fuzzy = { workspace = true }
cortexcode-tui-images = { workspace = true }

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
